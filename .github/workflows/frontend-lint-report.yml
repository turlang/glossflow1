name: Frontend Lint Report

on:
  push:
    branches: [agent/rebuild-hygiene-m2-9]
    paths:
      - .github/workflows/frontend-lint-report.yml

permissions:
  contents: write

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-hygiene-m2-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - working-directory: frontend
        run: npm ci
      - name: Capture ESLint output
        working-directory: frontend
        run: npm run lint > ../frontend-lint-report.txt 2>&1 || true
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-lint-report.txt
          git commit -m "chore: capture frontend lint report"
          git push origin HEAD:agent/rebuild-hygiene-m2-9
