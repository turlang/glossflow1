name: Remove Final Any Once

on:
  push:
    branches: [agent/rebuild-hygiene-m2-9]
    paths:
      - .github/workflows/remove-last-any.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-hygiene-m2-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: node scripts/remove-last-any.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/growth.routes.ts
          git commit -m "refactor: remove final explicit backend any"
          git push origin HEAD:agent/rebuild-hygiene-m2-9
