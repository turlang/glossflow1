name: Rebuild Maintenance

on:
  push:
    branches: [agent/rebuild-hygiene-m2-9]
    paths:
      - .github/workflows/rebuild-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-hygiene-m2-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Remove known dead frontend code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          schedule = Path('frontend/src/components/admin/ProfessionalScheduleAdmin.jsx')
          text = schedule.read_text(encoding='utf-8')
          text, count = re.subn(
              r"\nfunction toLocalInput\(iso\) \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('toLocalInput block not found exactly once')
          schedule.write_text(text, encoding='utf-8')

          caps = Path('frontend/src/components/admin/ProfessionalCapabilitiesAdmin.jsx')
          text = caps.read_text(encoding='utf-8')
          old = 'export function ProfessionalCapabilitiesAdmin({ salon, services, professionals, reload, setPage }) {'
          new = 'export function ProfessionalCapabilitiesAdmin({ services, professionals, reload, setPage }) {'
          if old not in text:
              raise SystemExit('ProfessionalCapabilitiesAdmin signature not found')
          caps.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate backend lock after security override
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/admin/ProfessionalScheduleAdmin.jsx frontend/src/components/admin/ProfessionalCapabilitiesAdmin.jsx backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No deterministic maintenance changes."
            exit 0
          fi
          git commit -m "chore: apply rebuild maintenance"
          git push origin HEAD:agent/rebuild-hygiene-m2-9
