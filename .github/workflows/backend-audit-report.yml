name: Backend Audit Report

on:
  push:
    branches: [agent/rebuild-hygiene-m2-9]
    paths:
      - .github/workflows/backend-audit-report.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-hygiene-m2-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - working-directory: backend
        run: npm ci --ignore-scripts
      - name: Capture audit JSON
        working-directory: backend
        run: npm audit --json > ../backend-audit-report.json || true
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-audit-report.json
          git commit -m "chore: capture backend audit report"
          git push origin HEAD:agent/rebuild-hygiene-m2-9
