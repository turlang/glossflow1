name: Production Smoke Validation

on:
  workflow_run:
    workflows: ["Production Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_URL: https://glossflow-api.onrender.com
      WEB_URL: https://glossflow1.vercel.app
    steps:
      - name: Allow production deploys to converge
        if: github.event_name == 'workflow_run'
        run: sleep 20

      - name: Check frontend production
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --max-time 45 "$WEB_URL/" > /tmp/frontend.html
          grep -q 'GlossFlow' /tmp/frontend.html

      - name: Wait for traced backend health contract
        run: |
          HEALTH_READY=false
          for attempt in $(seq 1 12); do
            echo "Health build attempt $attempt/12"
            if curl --silent --show-error --max-time 45 \
              --dump-header /tmp/health.headers \
              "$API_URL/health" > /tmp/health.json; then
              cat /tmp/health.json
              BUILD_HEADER="$(awk 'BEGIN{IGNORECASE=1} /^x-glossflow-build:/ {gsub(/\r/, "", $2); print $2}' /tmp/health.headers | tail -1)"
              BUILD_BODY="$(jq -r '.build // empty' /tmp/health.json)"
              echo "X-GlossFlow-Build: ${BUILD_HEADER:-missing}"
              echo "Health build: ${BUILD_BODY:-missing}"
              if jq -e 'type == "object" and .ok == true and (.build | type == "string") and (.build | length > 0)' /tmp/health.json > /dev/null 2>&1 \
                && [ -n "$BUILD_HEADER" ] \
                && [ "$BUILD_HEADER" = "$BUILD_BODY" ]; then
                HEALTH_READY=true
                break
              fi
            fi
            sleep 10
          done

          if [ "$HEALTH_READY" != "true" ]; then
            echo "Backend did not converge to the build-traceable Marco 22 health contract."
            cat /tmp/health.json || true
            exit 1
          fi

      - name: Wait for backend readiness contract and MongoDB
        run: |
          READY=false
          HEALTH_BUILD="$(jq -r '.build' /tmp/health.json)"
          for attempt in $(seq 1 12); do
            echo "Readiness attempt $attempt/12"
            if curl --silent --show-error --max-time 45 "$API_URL/ready" > /tmp/ready.json; then
              cat /tmp/ready.json
              READY_BUILD="$(jq -r '.build // empty' /tmp/ready.json)"
              if jq -e 'type == "object" and .ok == true and .database.ok == true and (.build | type == "string") and (.build | length > 0)' /tmp/ready.json > /dev/null 2>&1 \
                && [ "$READY_BUILD" = "$HEALTH_BUILD" ]; then
                READY=true
                break
              fi
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "Backend did not converge to the Marco 22 readiness contract with MongoDB and matching build ID."
            cat /tmp/ready.json || true
            exit 1
          fi

      - name: Check public salon
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --max-time 45 "$API_URL/public/salon" | tee /tmp/salon.json
          jq -e 'type == "object" and (.id != null or .slug != null or .name != null)' /tmp/salon.json > /dev/null

      - name: Check public catalog
        run: |
          for path in services professionals portfolio; do
            curl --fail-with-body --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --max-time 45 "$API_URL/$path" > "/tmp/$path.json"
            jq -e 'type == "array"' "/tmp/$path.json" > /dev/null
          done

      - name: Check public appointments read model
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 \
            --max-time 45 "$API_URL/appointments" > /tmp/appointments.json
          jq -e 'type == "array"' /tmp/appointments.json > /dev/null

      - name: Summary
        run: |
          echo "Frontend: OK"
          echo "Backend build: $(jq -r '.build' /tmp/health.json)"
          echo "Backend health: OK"
          echo "Backend readiness + MongoDB: OK"
          echo "Public salon: OK"
          echo "Services: $(jq 'length' /tmp/services.json)"
          echo "Professionals: $(jq 'length' /tmp/professionals.json)"
          echo "Portfolio: $(jq 'length' /tmp/portfolio.json)"
          echo "Appointments read model: $(jq 'length' /tmp/appointments.json)"
