# Render Blueprint — GlossFlow API / Client Ready
# Um único backend atende vários salões por tenant, vitrine white-label e WhatsApp.
services:
  - type: web
    name: glossflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate --schema prisma/schema.prisma && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

      # White-label / multi-tenant
      - key: PUBLIC_ROOT_DOMAIN
        sync: false
      - key: DEFAULT_PUBLIC_SALON_SLUG
        value: glossflow

      # Operação e segurança
      - key: RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: BUSINESS_TIMEZONE
        value: America/Sao_Paulo
      - key: BUSINESS_TIMEZONE_OFFSET
        value: "-03:00"
      - key: BOOKING_SLOT_INTERVAL_MINUTES
        value: "30"

      # IA
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # WhatsApp Cloud API / Meta
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      # Pagamentos — não são necessários para o primeiro cliente, permanecem opcionais
      - key: PAYMENTS_DRY_RUN
        value: "true"
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false

      # Observabilidade
      - key: SENTRY_DSN
        sync: false
