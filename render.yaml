# Render Blueprint — GlossFlow API
# Este é o blueprint canônico do backend. Não manter cópias divergentes em infra/.
services:
  - type: web
    name: glossflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production

      # Dados e segurança
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        value: https://glossflow-api.onrender.com

      # Super Admin — provisionamento idempotente no startup
      - key: SUPER_ADMIN_NAME
        value: Super Admin GlossFlow
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

      # White-label / multi-tenant
      - key: PUBLIC_ROOT_DOMAIN
        sync: false
      - key: DEFAULT_PUBLIC_SALON_SLUG
        value: glossflow
      - key: APP_PUBLIC_URL
        sync: false

      # Operação
      - key: RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: BUSINESS_TIMEZONE
        value: America/Sao_Paulo
      - key: BUSINESS_TIMEZONE_OFFSET
        value: "-03:00"
      - key: BOOKING_SLOT_INTERVAL_MINUTES
        value: "30"
      - key: CLIENT_CANCELLATION_MIN_HOURS
        value: "12"
      - key: APPOINTMENT_REMINDER_SCAN_MINUTES
        value: "10"

      # IA — Groq principal; OpenAI permanece apenas como fallback opcional
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # WhatsApp — Twilio é o provider operacional atual
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "55"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WEBHOOK_URL
        value: https://glossflow-api.onrender.com/webhooks/whatsapp/twilio
      - key: TWILIO_STATUS_CALLBACK_URL
        value: https://glossflow-api.onrender.com/webhooks/whatsapp/twilio/status
      - key: TWILIO_DEFAULT_SALON_SLUG
        value: glossflow
      # Trial é somente QA. Em sender de produção, configure false.
      - key: TWILIO_TRIAL_MODE
        sync: false
      - key: TWILIO_TRIAL_CONTENT_SID
        sync: false

      # Templates / Contents da Twilio
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: pt_BR
      - key: WHATSAPP_TEMPLATE_APPOINTMENT_CONFIRMED
        sync: false
      - key: WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED
        sync: false
      - key: WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER_24H
        sync: false
      - key: WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER_2H
        sync: false

      # Meta permanece suportada pelo código como provider alternativo,
      # mas não é necessária na configuração operacional atual.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      # Pagamentos opcionais
      - key: PAYMENTS_DRY_RUN
        value: "true"
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false

      # Observabilidade
      - key: SENTRY_DSN
        sync: false
